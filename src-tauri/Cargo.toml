[package]
name = "devtoollocal"
version = "0.0.2"
description = "Local-First Developer Tools (DevToys Clone)"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "devtoollocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-http = "~2.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2.7", features = ["inline"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
